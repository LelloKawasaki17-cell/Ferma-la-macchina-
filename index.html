
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Save The Dog 3.0</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080e19;color:white;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
canvas{display:block}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 45%,rgba(0,0,0,.65))}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:4}
.stat{background:rgba(5,12,25,.78);border:1px solid #ffffff25;padding:10px 13px;border-radius:13px;backdrop-filter:blur(8px);font-weight:bold;font-size:13px}
#center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;padding:20px}
.panel{width:min(440px,100%);background:linear-gradient(145deg,rgba(15,29,49,.97),rgba(5,10,20,.97));border:1px solid #7ebcff55;border-radius:24px;padding:27px 22px;text-align:center;box-shadow:0 20px 70px #000a}
h1{font-size:clamp(32px,9vw,52px);line-height:.95;margin:0 0 12px;font-weight:1000;letter-spacing:-2px}
h1 span{color:#55b9ff}
.subtitle{color:#a9c4df;line-height:1.5;font-size:14px}
button{border:0;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:900;cursor:pointer;color:#071321;background:linear-gradient(135deg,#8ce6ff,#339cff);box-shadow:0 6px 22px #168bff44}
button:active{transform:scale(.97)}
.mainbtn{width:100%;margin-top:18px}
.secondary{background:#263b53;color:white;margin-top:10px;width:100%;box-shadow:none}
#save{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:4;width:min(340px,86%);font-size:23px;padding:19px;background:linear-gradient(135deg,#9affb4,#20ce76);display:none;box-shadow:0 0 35px #32ff8b66}
#message{position:fixed;top:27%;left:0;right:0;text-align:center;z-index:3;font-size:clamp(24px,7vw,42px);font-weight:1000;text-shadow:0 4px 15px #000;pointer-events:none;padding:10px}
#hint{position:fixed;bottom:105px;left:0;right:0;text-align:center;color:white;text-shadow:0 2px 8px black;font-weight:bold;z-index:3;font-size:14px}
#sound{position:fixed;right:14px;bottom:17px;z-index:6;background:#172b43;color:white;padding:11px 14px;border-radius:12px;font-size:13px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.hidden{display:none!important}
.small{font-size:12px;color:#9db5cf;line-height:1.5}
</style>
</head>
<body>

<div id="game"></div>
<div id="vignette"></div>
<div id="flash"></div>

<div id="top">
  <div class="stat">🏆 Record: <span id="best">0</span></div>
  <div class="stat">⭐ Punti: <span id="score">0</span></div>
  <div class="stat">🪙 <span id="coins">0</span></div>
</div>

<div id="message"></div>
<div id="hint">Aspetta il momento giusto...</div>
<button id="save">🐶 SALVA IL CANE!</button>
<button id="sound">🔊 Audio ON</button>

<div id="center">
  <div class="panel" id="menu">
    <div style="font-size:52px;margin-bottom:10px">🐶</div>
    <h1>SAVE THE<br><span>DOG 3.0</span></h1>
    <p class="subtitle">
      Una Renault Clio blu sta arrivando!<br>
      Riuscirai a salvare il cane di Francesco?
    </p>
    <p class="small">Attendi il segnale e premi il pulsante prima dell'impatto.</p>
    <button class="mainbtn" id="start">INIZIA LA PARTITA</button>
    <p class="small">Attenzione: Francesco Esposito rischia di dover offrire 10 pizze!</p>
  </div>

  <div class="panel hidden" id="result">
    <div id="resultIcon" style="font-size:55px">🐶</div>
    <h1 id="resultTitle">SALVATO!</h1>
    <p class="subtitle" id="resultText"></p>
    <button class="mainbtn" id="again">GIOCA ANCORA</button>
    <button class="secondary" id="home">MENU PRINCIPALE</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* SAVE THE DOG 3.0 */

const root=document.getElementById("game");
const message=document.getElementById("message");
const hint=document.getElementById("hint");
const saveButton=document.getElementById("save");
const center=document.getElementById("center");

let scene,camera,renderer,clock;
let dog,car,carWheels=[],dogLegs=[],tail;
let rain=[];
let traffic=[];
let state="menu";
let timer=null;
let countdown=0;
let reactionTimer=0;
let carSpeed=0;
let score=0;
let coins=Number(localStorage.getItem("stdCoins")||0);
let best=Number(localStorage.getItem("stdBest")||0);
let soundOn=true;
let audioContext=null;
let fatherAppeared=false;
let weather="clear";
let police=false;
let round=0;
let lastFrame=0;
let particles=null;

const $=id=>document.getElementById(id);
$("best").textContent=best;
$("coins").textContent=coins;

function audio(freq=440,duration=.12,type="sine",volume=.06){
 if(!soundOn)return;
 try{
  audioContext ||= new (window.AudioContext||window.webkitAudioContext)();
  const o=audioContext.createOscillator();
  const g=audioContext.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(volume,audioContext.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
  o.connect(g);g.connect(audioContext.destination);
  o.start();o.stop(audioContext.currentTime+duration);
 }catch(e){}
}

function mat(color,rough=.7,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
function box(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);parent.add(m);return m;
}
function sphere(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,16),material);
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m;
}
function cylinder(parent,r1,r2,h,material,x,y,z,segments=16){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 m.position.set(x,y,z);parent.add(m);return m;
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x91b4d1);
 scene.fog=new THREE.FogExp2(0x91b4d1,.012);

 camera=new THREE.PerspectiveCamera(53,innerWidth/innerHeight,.1,180);
 camera.position.set(0,7.5,15);
 camera.lookAt(0,1,-8);

 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 root.appendChild(renderer.domElement);

 clock=new THREE.Clock();

 const hemi=new THREE.HemisphereLight(0xd9edff,0x263447,2.0);
 scene.add(hemi);

 const sun=new THREE.DirectionalLight(0xffe5c4,3.1);
 sun.position.set(-8,15,8);
 sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 sun.shadow.camera.left=-24;
 sun.shadow.camera.right=24;
 sun.shadow.camera.top=24;
 sun.shadow.camera.bottom=-24;
 scene.add(sun);

 buildWorld();
 buildDog();
 buildCar();
 buildRain();
 window.addEventListener("resize",resize);
 animate();
}

function buildWorld(){
 const ground=box(scene,120,.2,150,mat(0x344b45),0,-.2,-30);
 ground.receiveShadow=true;

 // Strada
 const road=box(scene,12,.12,130,mat(0x242c36,.95),0,-.06,-30);
 road.receiveShadow=true;

 // Marciapiedi
 for(const x of [-7,7]){
  const sidewalk=box(scene,2,.35,130,mat(0x8c969d),x,.08,-30);
  sidewalk.receiveShadow=true;
  for(let z=-90;z<35;z+=5){
   box(scene,.07,.02,4,mat(0x626e78),x,.27,z);
  }
 }

 // Linee stradali
 for(let z=-90;z<30;z+=8){
  box(scene,.13,.025,3.4,mat(0xf5f0d9),0,.015,z);
 }

 // Edifici
 const colors=[0x66788a,0x9b8d80,0x687e82,0x8b7e78,0x526a7d];
 for(let side of [-1,1]){
  for(let i=0;i<12;i++){
   const z=-90+i*10;
   const width=5+Math.random()*4;
   const height=7+Math.random()*13;
   const x=side*(10+Math.random()*4);
   const building=box(scene,width,height,8,mat(colors[i%colors.length]),x,height/2,z);
   building.receiveShadow=true;
   for(let y=2;y<height-1;y+=2.5){
    for(let xx=-width/2+1;xx<width/2-0.5;xx+=1.7){
     const window=box(scene,.85,1.2,.07,mat(Math.random()>.4?0x9bc9d5:0x25394a,.35),x+xx,y,z+4.04);
     if(Math.random()>.7)window.material.emissive=new THREE.Color(0x25465a);
    }
   }
  }
 }

 // Lampioni
 for(let side of [-1,1]){
  for(let z=-75;z<20;z+=19){
   const x=side*7.5;
   cylinder(scene,.09,.12,5,mat(0x303d48),x,2.5,z);
   const arm=box(scene,.12,.12,2,mat(0x303d48),x-side,4.8,z);
   const lamp=sphere(scene,x-side*1.9,4.7,z,.3,.13,.3,mat(0xffe6a3,.3));
   lamp.material.emissive=new THREE.Color(0xffb94f);
  }
 }

 // Alberi
 for(let side of [-1,1]){
  for(let z=-83;z<24;z+=13){
   const x=side*(9+Math.random()*2);
   cylinder(scene,.25,.35,2,mat(0x493b2e),x,1,z);
   sphere(scene,x,2.5,z,1.3,1.6,1.3,mat(0x315e4a));
   sphere(scene,x-.7,2.1,z+.2,.8,1,.8,mat(0x3d7355));
  }
 }
}

function buildDog(){
 dog=new THREE.Group();
 scene.add(dog);
 dog.position.set(2.2,.1,-1.8);

 const fur=mat(0xd5a45f);
 const lightFur=mat(0xf0d1a0);
 const dark=mat(0x543a2c);
 const black=mat(0x17191b,.3);
 const eyes=mat(0x17100c,.2);

 // Corpo e petto
 sphere(dog,0,.75,0,.55,.55,.95,fur);
 sphere(dog,0,.65,-.63,.38,.48,.32,lightFur);

 // Testa
 sphere(dog,0,1.42,-.72,.48,.48,.48,fur);
 sphere(dog,0,1.2,-1.08,.3,.23,.35,lightFur);
 sphere(dog,0,1.3,-1.37,.16,.12,.13,black);

 // Orecchie
 for(let s of [-1,1]){
  const ear=sphere(dog,s*.37,1.45,-.62,.18,.38,.17,dark);
  ear.rotation.z=s*-.35;
  sphere(dog,s*.19,1.52,-1.12,.07,.08,.045,eyes);
  sphere(dog,s*.205,1.55,-1.16,.025,.025,.02,mat(0xffffff));
 }

 // Zampe animate
 for(let s of [-1,1]){
  for(let z of [-.55,.55]){
   const leg=sphere(dog,s*.3,.35,z,.17,.42,.18,fur);
   leg.position.y=.38;
   dogLegs.push(leg);
  }
 }

 tail=sphere(dog,0,1.05,.83,.13,.14,.55,fur);
 tail.rotation.x=-.6;

 // Collare
 const collar=new THREE.Mesh(new THREE.TorusGeometry(.35,.055,8,24),mat(0x1687e5));
 collar.position.set(0,1.1,-.73);
 collar.rotation.x=Math.PI/2;
 dog.add(collar);

 dog.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
}

function buildCar(){
 car=new THREE.Group();
 scene.add(car);
 car.position.set(0,.12,-34);

 const blue=mat(0x0759c8,.25,.45);
 const glass=mat(0x142d43,.18,.25);
 const black=mat(0x10151b,.65);
 const tire=mat(0x090b0e);
 const silver=mat(0xb7c7d4,.25,.75);
 const red=mat(0xd7192c,.3);

 // Carrozzeria
 box(car,2.05,.58,4.15,blue,0,.72,0);
 box(car,1.85,.18,3.5,blue,0,1.04,-.05);

 // Abitacolo
 const cabin= new THREE.Mesh(new THREE.BoxGeometry(1.65,.9,2.15),glass);
 cabin.position.set(0,1.42,-.15);
 car.add(cabin);

 // Tetto
 box(car,1.7,.12,1.6,blue,0,1.9,-.25);

 // Cofano e paraurti
 box(car,1.95,.25,1.1,blue,0,.92,-1.55);
 box(car,2.1,.22,.25,black,0,.45,-2.1);
 box(car,2.1,.2,.25,blue,0,.48,2.1);

 // Fari
 for(let s of [-1,1]){
  const light=box(car,.42,.2,.07,mat(0xfff3cb,.2),s*.72,.88,-2.09);
  light.material.emissive=new THREE.Color(0xffe6a3);
  box(car,.42,.2,.07,red,s*.72,.86,2.1);

  // Ruote
  for(let z of [-1.35,1.35]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.24,24),tire);
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(s*1.02,.48,z);
   car.add(wheel);carWheels.push(wheel);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.25,16),silver);
   hub.rotation.z=Math.PI/2;
   hub.position.copy(wheel.position);
   car.add(hub);
  }
  box(car,.1,.08,.6,silver,s*1.04,1.05,-.25);
 }

 // Specchietti
 for(let s of [-1,1]){
  box(car,.25,.15,.3,blue,s*1.05,1.2,-.75);
 }
 // Targa
 box(car,.65,.16,.04,mat(0xffffff),0,.49,-2.24);

 car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
}

function buildRain(){
 const geo=new THREE.BufferGeometry();
 const positions=[];
 for(let i=0;i<450;i++){
  positions.push((Math.random()-.5)*35,Math.random()*18,Math.random()*-70+15);
 }
 geo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
 particles=new THREE.Points(geo,new THREE.PointsMaterial({color:0xb8d8ff,size:.075,transparent:true,opacity:.65}));
 particles.visible=false;
 scene.add(particles);
}

function makeTraffic(){
 const group=new THREE.Group();
 const body=box(group,1.7,.6,3.3,mat(0xb5b9c0),0,.65,0);
 box(group,1.35,.7,1.7,mat(0x26394c),0,1.18,0);
 group.position.set(Math.random()>.5?-3.2:3.2,.1,-60);
 scene.add(group);
 traffic.push(group);
}

function resize(){
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
}

function showPanel(which){
 $("menu").classList.toggle("hidden",which!=="menu");
 $("result").classList.toggle("hidden",which!=="result");
 center.style.display=which?"flex":"none";
}

function updateStats(){
 $("score").textContent=score;
 $("best").textContent=best;
 $("coins").textContent=coins;
}

function startGame(){
 if(state==="playing")return;
 state="playing";
 round++;
 score=0;
 updateStats();
 showPanel(null);
 saveButton.style.display="none";
 message.textContent="";
 hint.textContent="La strada sembra tranquilla...";
 car.position.set(0,.12,-34);
 carSpeed=0;
 fatherAppeared=false;
 police=Math.random()<.12;
 weather=Math.random()<.32?"rain":"clear";
 particles.visible=weather==="rain";
 scene.background=new THREE.Color(weather==="rain"?0x53677c:0x91b4d1);
 scene.fog.color.set(weather==="rain"?0x53677c:0x91b4d1);
 scene.fog.density=weather==="rain"?.019:.012;
 camera.position.set(0,7.5,15);
 camera.lookAt(0,1,-8);
 traffic.forEach(t=>scene.remove(t));
 traffic=[];
 if(Math.random()<.38)makeTraffic();
 if(police)hint.textContent="🚨 Attenzione: la polizia è in zona!";
 else if(weather==="rain")hint.textContent="🌧️ Sta iniziando a piovere!";
 else hint.textContent="Un'auto sta arrivando da lontano...";
 countdown=3+Math.random()*4;
 timer=countdown;
}

function beginWarning(){
 if(state!=="playing")return;
 state="warning";
 reactionTimer=1.25;
 message.textContent="🚨 ADESSO!";
 hint.textContent="PREMI SUBITO PER SALVARLO!";
 saveButton.style.display="block";
 audio(880,.18,"square",.07);
}

function saveDog(){
 if(state!=="warning")return;
 state="saved";
 saveButton.style.display="none";
 message.textContent="🐶 SALVATO!";
 hint.textContent="Sei stato velocissimo!";
 carSpeed=0;
 score+=100;
 coins+=5;
 localStorage.setItem("stdCoins",coins);
 updateStats();
 audio(700,.15);
 setTimeout(()=>audio(950,.2),130);
 setTimeout(()=>finish(true),1000);
}

function fail(){
 if(state!=="warning"&&state!=="playing")return;
 state="accident";
 saveButton.style.display="none";
 message.textContent="💥 IMPATTO!";
 hint.textContent="La Renault Clio ha colpito il cane!";
 carSpeed=0;
 audio(100,.5,"sawtooth",.12);

 // Probabilità esatta del padre: 35%
 fatherAppeared=Math.random()<0.35;

 setTimeout(()=>{
  if(fatherAppeared){
   finish(false,true);
  }else{
   finish(false,false);
  }
 },1200);
}

function finish(saved, father=false){
 state="result";
 message.textContent="";
 hint.textContent="";
 showPanel("result");

 if(saved){
  $("resultIcon").textContent="🏆🐶";
  $("resultTitle").textContent="SALVATAGGIO!";
  $("resultText").innerHTML="Hai salvato il cane di Francesco!<br><br>+100 punti<br>+5 monete<br><br>Francesco ti ringrazia!";
 }else if(father){
  $("resultIcon").textContent="👨‍🦳💶";
  $("resultTitle").textContent="È ARRIVATO PAPÀ!";
  $("resultText").innerHTML="Francesco Esposito è nei guai... ma suo padre interviene!<br><br>«Francesco, lascia stare queste pizze! Il paraurti lo pago io! E poi basta con questo lavoro da lavapiatti, LICENZIATI!»<br><br>Il padre paga i danni. Nessuna pizza da offrire!";
 }else{
  $("resultIcon").textContent="🚗💥🍕";
  $("resultTitle").textContent="DISASTRO!";
  $("resultText").innerHTML="La Clio blu ha danneggiato il paraurti!<br><br><b>Francesco Esposito deve offrire 10 PIZZE al proprietario dell'auto!</b><br><br>La prossima volta devi essere più veloce!";
 }
 if(saved){
  if(score>best){best=score;localStorage.setItem("stdBest",best);}
 }
 updateStats();
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 const t=clock.elapsedTime;

 // Animazione cane
 if(dog){
  dog.position.y=.1+Math.sin(t*3)*.035;
  tail.rotation.x=-.6+Math.sin(t*8)*.45;
  dogLegs.forEach((leg,i)=>{
   leg.rotation.x=Math.sin(t*8+i*Math.PI)*.16;
  });
 }

 // Auto in movimento
 if(state==="playing"||state==="warning"||state==="accident"){
  if(state==="playing"){
   timer-=dt;
   carSpeed=1.5;
   car.position.z+=carSpeed*dt;
   if(timer<=0)beginWarning();
  }else if(state==="warning"){
   reactionTimer-=dt;
   carSpeed=7.8;
   car.position.z+=carSpeed*dt;
   if(reactionTimer<=0)fail();
  }else if(state==="accident"){
   carSpeed=Math.min(carSpeed+dt*10,12);
   car.position.z+=carSpeed*dt;
  }
  carWheels.forEach(w=>w.rotation.x+=carSpeed*dt*2.5);
 }

 // Traffico
 traffic.forEach(v=>{
  v.position.z+=dt*3;
  if(v.position.z>25)v.position.z=-80;
 });

 // Pioggia
 if(particles.visible){
  const a=particles.geometry.attributes.position;
  for(let i=0;i<a.count;i++){
   let y=a.getY(i)-dt*17;
   if(y<0)y=17;
   a.setY(i,y);
  }
  a.needsUpdate=true;
 }

 // Camera cinematografica
 if(state==="playing"||state==="warning"){
  camera.position.x=Math.sin(t*.3)*.13;
  camera.position.y=7.5+Math.sin(t*.7)*.08;
  camera.lookAt(0,1,-8);
 }

 renderer.render(scene,camera);
}

$("start").addEventListener("click",startGame);
$("again").addEventListener("click",startGame);
$("home").addEventListener("click",()=>{
 state="menu";
 showPanel("menu");
 saveButton.style.display="none";
 message.textContent="";
 hint.textContent="Pronto per una nuova avventura?";
 car.position.set(0,.12,-34);
});
saveButton.addEventListener("click",saveDog);
$("sound").addEventListener("click",()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 Audio ON":"🔇 Audio OFF";
});

init();
showPanel("menu");
</script>
</body>
</html>
